spring.application.name=wedding-invitation
server.port=${PORT:8080}

# Cloud MySQL Database Configuration
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://mysql-2b7ddcb6-adi2002rawat-8e10.k.aivencloud.com:15662/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true&useSSL=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:avnadmin}
