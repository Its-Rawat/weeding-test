<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="100%" height="100%">
  <defs>
    <!-- Royal Crimson Background Gradient -->
    <radialGradient id="royalBg" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#A51C2C" />
      <stop offset="70%" stop-color="#73111C" />
      <stop offset="100%" stop-color="#460A11" />
    </radialGradient>

    <!-- Metallic Royal Gold Gradient -->
    <linearGradient id="goldSheen" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF5C2" />
      <stop offset="35%" stop-color="#F2D177" />
      <stop offset="70%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996D19" />
    </linearGradient>

    <!-- Luminous Rose Petal Gradient -->
    <linearGradient id="rosePetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7A1B2" />
      <stop offset="60%" stop-color="#DD4B68" />
      <stop offset="100%" stop-color="#A01D35" />
    </linearGradient>

    <!-- Inner Blossom Gradient -->
    <linearGradient id="innerPetal" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFCAD6" />
      <stop offset="60%" stop-color="#ED6B85" />
      <stop offset="100%" stop-color="#BD2A48" />
    </linearGradient>

    <!-- Gold Center Pistil -->
    <radialGradient id="goldCenter" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFAD9" />
      <stop offset="40%" stop-color="#F9D463" />
      <stop offset="85%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#996E1A" />
    </radialGradient>

    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="1" stdDeviation="1.5" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Circular Badge Foundation -->
  <circle cx="64" cy="64" r="60" fill="url(#royalBg)" />
  <circle cx="64" cy="64" r="59" fill="none" stroke="url(#goldSheen)" stroke-width="2.5" />
  <circle cx="64" cy="64" r="55" fill="none" stroke="#FFEBA8" stroke-width="0.8" stroke-dasharray="2,2" opacity="0.85" />

  <!-- Outer Layer of 8 Blooming Petals -->
  <g filter="url(#subtleGlow)">
    <!-- 8 Petals rotated around 64,64 -->
    <g id="petalsOuter">
      <path d="M 64 22 C 73 34, 76 46, 64 56 C 52 46, 55 34, 64 22 Z" fill="url(#rosePetal)" stroke="url(#goldSheen)" stroke-width="1.2" />
      <path d="M 64 22 C 73 34, 76 46, 64 56 C 52 46, 55 34, 64 22 Z" fill="url(#rosePetal)" stroke="url(#goldSheen)" stroke-width="1.2" transform="rotate(45 64 64)" />
      <path d="M 64 22 C 73 34, 76 46, 64 56 C 52 46, 55 34, 64 22 Z" fill="url(#rosePetal)" stroke="url(#goldSheen)" stroke-width="1.2" transform="rotate(90 64 64)" />
      <path d="M 64 22 C 73 34, 76 46, 64 56 C 52 46, 55 34, 64 22 Z" fill="url(#rosePetal)" stroke="url(#goldSheen)" stroke-width="1.2" transform="rotate(135 64 64)" />
      <path d="M 64 22 C 73 34, 76 46, 64 56 C 52 46, 55 34, 64 22 Z" fill="url(#rosePetal)" stroke="url(#goldSheen)" stroke-width="1.2" transform="rotate(180 64 64)" />
      <path d="M 64 22 C 73 34, 76 46, 64 56 C 52 46, 55 34, 64 22 Z" fill="url(#rosePetal)" stroke="url(#goldSheen)" stroke-width="1.2" transform="rotate(225 64 64)" />
      <path d="M 64 22 C 73 34, 76 46, 64 56 C 52 46, 55 34, 64 22 Z" fill="url(#rosePetal)" stroke="url(#goldSheen)" stroke-width="1.2" transform="rotate(270 64 64)" />
      <path d="M 64 22 C 73 34, 76 46, 64 56 C 52 46, 55 34, 64 22 Z" fill="url(#rosePetal)" stroke="url(#goldSheen)" stroke-width="1.2" transform="rotate(315 64 64)" />
    </g>

    <!-- Middle Interlocking Layer (22.5 deg offset) -->
    <g id="petalsMiddle" transform="rotate(22.5 64 64)">
      <path d="M 64 28 C 71 38, 73 48, 64 58 C 55 48, 57 38, 64 28 Z" fill="url(#innerPetal)" stroke="#FFF2B2" stroke-width="1" />
      <path d="M 64 28 C 71 38, 73 48, 64 58 C 55 48, 57 38, 64 28 Z" fill="url(#innerPetal)" stroke="#FFF2B2" stroke-width="1" transform="rotate(45 64 64)" />
      <path d="M 64 28 C 71 38, 73 48, 64 58 C 55 48, 57 38, 64 28 Z" fill="url(#innerPetal)" stroke="#FFF2B2" stroke-width="1" transform="rotate(90 64 64)" />
      <path d="M 64 28 C 71 38, 73 48, 64 58 C 55 48, 57 38, 64 28 Z" fill="url(#innerPetal)" stroke="#FFF2B2" stroke-width="1" transform="rotate(135 64 64)" />
      <path d="M 64 28 C 71 38, 73 48, 64 58 C 55 48, 57 38, 64 28 Z" fill="url(#innerPetal)" stroke="#FFF2B2" stroke-width="1" transform="rotate(180 64 64)" />
      <path d="M 64 28 C 71 38, 73 48, 64 58 C 55 48, 57 38, 64 28 Z" fill="url(#innerPetal)" stroke="#FFF2B2" stroke-width="1" transform="rotate(225 64 64)" />
      <path d="M 64 28 C 71 38, 73 48, 64 58 C 55 48, 57 38, 64 28 Z" fill="url(#innerPetal)" stroke="#FFF2B2" stroke-width="1" transform="rotate(270 64 64)" />
      <path d="M 64 28 C 71 38, 73 48, 64 58 C 55 48, 57 38, 64 28 Z" fill="url(#innerPetal)" stroke="#FFF2B2" stroke-width="1" transform="rotate(315 64 64)" />
    </g>
  </g>

  <!-- Golden Core Rosette -->
  <circle cx="64" cy="64" r="14" fill="url(#goldCenter)" stroke="#FFFCE6" stroke-width="1.5" />
  <circle cx="64" cy="64" r="8" fill="#FFE58F" stroke="#996D19" stroke-width="0.8" />

  <!-- Center Diamond Sparkle -->
  <polygon points="64,57 66,63 72,64 66,65 64,71 62,65 56,64 62,63" fill="#FFFFFF" />

  <!-- Golden Pearls around rosette -->
  <circle cx="64" cy="46" r="1.5" fill="#FFFBE6" />
  <circle cx="77" cy="51" r="1.5" fill="#FFFBE6" />
  <circle cx="82" cy="64" r="1.5" fill="#FFFBE6" />
  <circle cx="77" cy="77" r="1.5" fill="#FFFBE6" />
  <circle cx="64" cy="82" r="1.5" fill="#FFFBE6" />
  <circle cx="51" cy="77" r="1.5" fill="#FFFBE6" />
  <circle cx="46" cy="64" r="1.5" fill="#FFFBE6" />
  <circle cx="51" cy="51" r="1.5" fill="#FFFBE6" />
</svg>
