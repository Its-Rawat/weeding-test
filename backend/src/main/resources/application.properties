server.port=${PORT:8080}

# Database Configuration (Cloud MySQL with automatic fallback to H2)
# When deploying to Render, if SPRING_DATASOURCE_URL is set, it connects to MySQL.
# If not set (or cloud DB is offline), it gracefully falls back to H2 in-memory DB so the service is ALWAYS Live!
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:h2:mem:weddingdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driver-class-name=${SPRING_DATASOURCE_DRIVER:org.h2.Driver}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:sa}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.jpa.database-platform=${SPRING_JPA_DIALECT:org.hibernate.dialect.H2Dialect}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# Logging
logging.level.com.wedding.didi=INFO

# Admin API Security Key
admin.secret.key=AdityaWeddingAdmin2026!#

# Email Notification Settings
wedding.admin.notification-email=adi2002rawat@gmail.com
wedding.mail.enabled=true

# Spring Mail (Gmail SMTP configuration)
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${SPRING_MAIL_USERNAME:adi2002rawat@gmail.com}
spring.mail.password=${SPRING_MAIL_PASSWORD:}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

