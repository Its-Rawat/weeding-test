spring.application.name=wedding-invitation
server.port=${PORT:8080}

# H2 File-based Database Persistence
spring.datasource.url=jdbc:h2:file:./database/weddingdb;DB_CLOSE_ON_EXIT=FALSE;AUTO_RECONNECT=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# Admin Authentication
wedding.admin.password=P@ssw0rd

# Static & Web Configuration
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force=true
spring.web.resources.static-locations=classpath:/static/
